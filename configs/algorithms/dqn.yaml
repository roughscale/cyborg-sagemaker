# DQN Configuration for CybORG RL Training
# Double DQN with Dueling policy and Prioritized Experience Replay
# Uses fully observable environment (fully_obs: true) since DQN has no recurrent memory

# Environment Configuration
# ObsHistoryWrapper accumulates partial observations into a full belief state,
# equivalent to fully_obs=True but implemented at the wrapper level.
use_obs_history: true
randomize_env: false

max_params:
  MAX_HOSTS: 5
  MAX_PROCESSES: 5
  MAX_CONNECTIONS: 2
  MAX_VULNERABILITIES: 1
  MAX_INTERFACES: 2
  MAX_SESSIONS: 5
  MAX_USERS: 5
  MAX_FILES: 0
  MAX_GROUPS: 0
  MAX_PATCHES: 0

# Default Hyperparameters
hyperparameters:
  # Core RL parameters
  gamma: 0.99
  learning_rate: 0.0001

  # DQN parameters
  batch_size: 32
  initial_epsilon: 1.0
  final_epsilon: 0.02
  exploration_fraction: 0.9

  # PER (Prioritized Experience Replay)
  prioritized_replay_alpha: 0.9
  prioritized_replay_beta0: 0.4

# Network Architecture
network:
  type: mlp
  # Single hidden layer, same size as input (matches RedDQNAgent)
  hidden_size: input

# Training Configuration
training:
  total_steps: 200000
  n_envs: 1
  checkpoint_freq: 10000
  device: auto

# Scenario Configuration
scenario: dqn_scenario.yaml
