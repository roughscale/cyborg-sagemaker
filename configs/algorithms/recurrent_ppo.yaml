# Recurrent PPO Configuration for CybORG RL Training
# Proximal Policy Optimization with LSTM for partial observability

# Environment Configuration
use_obs_history: false  # RecurrentPPO uses raw partial obs; LSTM handles the POMDP
randomize_env: false
max_steps: 1000

max_params:
  MAX_HOSTS: 5
  MAX_PROCESSES: 2
  MAX_CONNECTIONS: 2
  MAX_VULNERABILITIES: 1
  MAX_INTERFACES: 2
  MAX_SESSIONS: 3
  MAX_USERS: 5
  MAX_FILES: 0
  MAX_GROUPS: 0
  MAX_PATCHES: 0

hyperparameters:
  gamma: 0.99
  learning_rate: 0.00003

  n_steps: 2048
  batch_size: 512         # 4 minibatches per epoch
  n_epochs: 4             # 16 gradient steps per rollout (vs 40 before) — fewer updates on ~4-5 episodes
  clip_range: 0.05        # tight constraint to prevent catastrophic collapse

  gae_lambda: 0.95
  normalize_advantage: true

  ent_coef: 0.01
  vf_coef: 0.25           # conservative critic updates — value function diverged in previous run
  target_kl: 0.01         # early stopping threshold (epoch stops if mean approx_kl > 1.5 * target_kl)
  lstm_num_layers: 1      # n_lstm_layers passed to MlpLstmPolicy policy_kwargs

network:
  type: lstm
  hidden_size: input
  lstm_num_layers: 1

training:
  total_steps: 750000
  n_envs: 1
  checkpoint_freq: 10000
  device: auto

scenario: recurrent_ppo_scenario.yaml
