# PPO Configuration for CybORG RL Training
# Proximal Policy Optimization (MLP policy, fully observable via ObsHistoryWrapper)

# Environment Configuration
use_obs_history: true
randomize_env: false
max_steps: 1000

max_params:
  MAX_HOSTS: 5
  MAX_PROCESSES: 5
  MAX_CONNECTIONS: 2
  MAX_VULNERABILITIES: 1
  MAX_INTERFACES: 2
  MAX_SESSIONS: 5
  MAX_USERS: 5
  MAX_FILES: 0
  MAX_GROUPS: 0
  MAX_PATCHES: 0

# Default Hyperparameters
hyperparameters:
  # Core RL parameters
  gamma: 0.99
  learning_rate: 0.0001

  # PPO parameters
  n_steps: 1024           # Number of steps per rollout
  batch_size: 1024        # Minibatch size (must be multiple of n_steps * n_envs)
  n_epochs: 10            # Number of epochs per update
  clip_range: 0.1         # PPO clip range (0.2 is default, 0.1 more conservative)

  # Advantage estimation
  gae_lambda: 0.95        # GAE lambda (0.95 default, reduces variance vs 1.0)
  normalize_advantage: true   # Normalize advantages across batch

  # Loss coefficients
  ent_coef: 0.01          # Entropy coefficient for exploration (encourages diverse actions)
  vf_coef: 1.0            # Value function loss coefficient (0.5 default)

# Network Architecture
network:
  type: mlp
  # Architecture is dynamically set to [input_size, input_size]
  hidden_size: input

# Training Configuration
training:
  total_steps: 400000
  n_envs: 1
  checkpoint_freq: 10000
  device: auto

# Scenario Configuration
scenario: ppo_scenario.yaml
